<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VCD Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
    <div class="login-card">
        <div class="login-logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <rect width="40" height="40" rx="10" fill="#1095d3"/>
                <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="white" opacity="0.9"/>
                <circle cx="20" cy="20" r="4" fill="#1095d3"/>
            </svg>
            <span>VMware Cloud Director Assistant</span>
        </div>
        <h2>Sign in to your session</h2>
        <form id="login-form">
            <div class="field">
                <label for="org">Organization</label>
                <select id="org" autocomplete="organization" required>
                    <option value="ban2_identity_edir">ban2_identity_edir</option>
                    <option value="ban2_identity_ilm">ban2_identity_ilm</option>
                    <option value="ban2_identity_idm">ban2_identity_idm</option>
                </select>
            </div>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required  />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password"  />
            </div>
            <button type="submit" class="btn-primary btn-full" id="login-btn">Start Session</button>
        </form>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- MAIN APP -->
<div class="app hidden" id="app">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-brand">
            <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
                <rect width="40" height="40" rx="10" fill="#c9462b"/>
                <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="white" opacity="0.9"/>
                <circle cx="20" cy="20" r="4" fill="#c9462b"/>
            </svg>
            VCD Assistant
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="topbar-user" id="topbar-user"></div>
            <div id="llm-status" style="font-size:0.98em;color:#6366f1;font-weight:500;"></div>
        </div>
    </div>

    <div class="workspace">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="stab active" data-tab="vms">My VMs</button>
                <button class="stab" data-tab="create">Create VM</button>
            </div>

            <!-- VMs TAB -->
            <div class="stab-content active" id="tab-vms">
                <div class="panel-toolbar">
                    <span class="panel-title">Virtual Machines</span>
                    <button class="icon-btn" id="refresh-vms" title="Refresh">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                    </button>
                </div>
                <div class="vm-filter">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="on">Running</button>
                    <button class="filter-btn" data-filter="off">Stopped</button>
                </div>
                <div class="vm-list" id="vm-list">
                    <div class="vm-placeholder">Loading VMs…</div>
                </div>
            </div>

            <!-- CREATE VM TAB -->
            <div class="stab-content" id="tab-create">
                <div class="panel-title" style="padding:12px 16px 8px;">New Virtual Machine</div>
                <form id="create-vm-form" class="create-form">
                    <div class="field">
                        <label>VM Name</label>
                        <input type="text" name="vm_name" placeholder="my-vm-01" required />
                    </div>
                    <div class="field">
                        <label>Template ID</label>
                        <input type="text" name="template_id" placeholder="Leave blank for default" />
                    </div>
                    <div class="field">
                        <label>Network Name</label>
                        <input type="text" name="network_name" placeholder="Leave blank for default" />
                    </div>
                    <div class="field">
                        <label>IP Address <span class="hint">(MANUAL only)</span></label>
                        <div class="field-row">
                            <input type="text" name="ip_address" placeholder="10.0.0.10" />
                            <button type="button" class="btn-ghost btn-small" id="fetch-free-ip">Fetch Free IP</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>Power On After Create</label>
                        <select name="power_on">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Deploy VM</button>
                </form>
                <div class="create-status" id="create-status"></div>
            </div>
        </aside>

        <!-- DRAG DIVIDER -->
        <div class="panel-divider" id="panel-divider"></div>

        <!-- RIGHT PANEL (chat + terminal tabs) -->
        <div class="main-panel" id="main-panel">

            <!-- TAB BAR -->
            <div class="panel-tabbar" id="panel-tabbar">
                <div class="panel-tab pinned active" data-pane="chat" id="tab-chat">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    Chat
                </div>
            </div>

            <!-- PANE CONTAINER -->
            <div class="panel-content" id="panel-content">

                <!-- CHAT PANE -->
                <div class="panel-pane active" id="pane-chat">
                    <div class="chat-messages" id="chat-messages">
                        <div class="welcome-msg">
                            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                                <rect width="40" height="40" rx="10" fill="#c9462b"/>
                                <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="white" opacity="0.9"/>
                                <circle cx="20" cy="20" r="4" fill="#c9462b"/>
                            </svg>
                            <p>Hello! I'm your VCD assistant. Ask me to list your VMs, start or stop a VM, or help you create one.</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <form id="chat-form">
                            <input type="text" id="chat-input" placeholder="Ask about your VMs…" autocomplete="off" />
                            <button type="submit" class="send-btn" id="send-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <line x1="22" y1="2" x2="11" y2="13"/>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
                <!-- terminal panes injected here by JS -->

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
