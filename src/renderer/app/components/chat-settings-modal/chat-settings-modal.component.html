<div class="settings-modal" (click)="onOverlayClick()">
  <div class="settings-modal-content" (click)="$event.stopPropagation()">
    <div class="settings-modal-header">
      <h2 class="settings-modal-title">Tools & Settings</h2>
      <button
        (click)="onCloseClick($event)"
        class="settings-close-btn"
        type="button"
        aria-label="Close settings">
        ✕
      </button>
    </div>

    <div class="settings-modal-body">
      <div *ngIf="availableTools.length > 0; else emptyState" class="tools-section">
        <h3 class="tools-section-title">Available Tools</h3>
        <p class="tools-section-subtitle">Click a tool to call it directly, or ask Copilot to use them</p>

        <div class="tools-grid">
          <button
            *ngFor="let tool of availableTools"
            (click)="onToolSelect(tool.name)"
            class="tool-card"
            type="button"
            [disabled]="busy"
            [class.is-active]="activeTool === tool.name">
            <div class="tool-name">{{ tool.name }}</div>
            <div class="tool-category">{{ tool.category }}</div>
            <div class="tool-desc">{{ tool.description }}</div>
          </button>
        </div>
      </div>

      <ng-template #emptyState>
        <div class="no-tools">
          <p>No tools available</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
