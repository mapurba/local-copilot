<div class="chat-shell h-full overflow-hidden rounded-xl bg-slate-50 dark:bg-slate-950">
  <div class="chat-scroll flex-1 overflow-y-auto p-4 sm:p-6">
    <div *ngIf="!messages.length && !isLoading" class="chat-empty">
      <div class="chat-empty-title">Ask Copilot anything</div>
      <div class="chat-empty-subtitle">Try debugging help, code review prompts, or architecture questions.</div>
    </div>

    <div *ngFor="let msg of messages" class="chat-row" [ngClass]="msg.role === 'user' ? 'is-user' : 'is-assistant'">
      <div class="chat-bubble" [ngClass]="msg.role === 'user' ? 'bubble-user' : 'bubble-assistant'">
        <p class="chat-text leading-relaxed">{{ msg.content }}</p>
        <p class="chat-time">{{ msg.timestamp | date:'HH:mm:ss' }}</p>
      </div>
    </div>

    <div *ngIf="isLoading" class="chat-row is-assistant">
      <div class="chat-bubble bubble-assistant">
        <div class="flex items-center gap-2">
          <span class="chat-loader" aria-hidden="true"></span>
          <p class="chat-text">Copilot is thinking...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="composer border-t border-slate-200 bg-white/90 p-3 dark:border-slate-800 dark:bg-slate-900/90 sm:p-4">
    <div class="mb-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-3">
      <label class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">Model</label>
      <select
        [(ngModel)]="selectedModel"
        [disabled]="isLoading"
        [title]="selectedModel"
        class="model-select w-full sm:w-auto sm:min-w-[28rem] md:min-w-[34rem] max-w-full px-3 py-2 pr-10 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md text-sm text-slate-900 dark:text-white shadow-sm">
        <option *ngFor="let model of models" [value]="model.id">{{ model.label || model.id || 'Model' }}</option>
      </select>
    </div>

    <div class="flex gap-2 items-end">
      <textarea
        [(ngModel)]="inputText"
        (keydown)="onKeyDown($event)"
        [disabled]="isLoading"
        placeholder="Ask Copilot to explain code, review an idea, or help with implementation..."
        class="chat-input flex-1 min-h-[3.5rem] max-h-40 px-3 py-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/40 resize-none shadow-sm"
        rows="3"></textarea>
      <button
        (click)="sendMessage()"
        [disabled]="!inputText.trim() || isLoading"
        class="px-5 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-500 rounded-lg text-sm font-semibold transition whitespace-nowrap text-white shadow-sm">
        Send
      </button>
    </div>
  </div>
</div>
